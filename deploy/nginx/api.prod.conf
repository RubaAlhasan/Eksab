# Production: TLS termination for ${API_DOMAIN}, substituted from .env at container start.
#
# Chicken-and-egg on first boot: this config references certificate files that certbot has
# not created yet, so nginx will refuse to start. Bring the stack up with api.local.conf
# first, issue the certificate, THEN switch NGINX_CONF to this file. The README spells out
# the order.

server {
    listen 80;
    server_name ${API_DOMAIN};

    # Must stay on HTTP and must not be redirected -- this is how certbot proves the domain.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${API_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${API_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Business logo uploads post multipart bodies; nginx's 1m default rejects them.
    client_max_body_size 20m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # This is what makes OpenIddict emit https:// URLs. Losing it breaks the whole
        # auth flow -- see the RequireHttpsMetadata comment in docker-compose.yml.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # SignalR notification hub -- HubRoute("/signalr-hubs/notifications").
    location /signalr-hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
