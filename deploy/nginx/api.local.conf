# Local rehearsal: plain HTTP, no certificates.
# Exercises everything the production config does except TLS termination itself.

server {
    listen 80;
    server_name _;

    # Business logo uploads post multipart bodies; nginx's 1m default rejects them.
    client_max_body_size 20m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # SignalR notification hub -- HubRoute("/signalr-hubs/notifications").
    # Without the Upgrade/Connection headers the WebSocket handshake fails and the client
    # silently degrades to long-polling; without the long read timeout nginx kills idle
    # connections after 60s and clients reconnect in a loop.
    location /signalr-hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
