<div class="eks-biz-shell d-flex" [class.dark]="darkMode()" [attr.dir]="direction()">
  <!-- Mobile drawer backdrop -->
  @if (mobileNavOpen()) {
    <div class="eks-biz-backdrop d-lg-none" (click)="closeMobileNav()"></div>
  }

  <aside class="eks-biz-sidebar" [class.eks-biz-sidebar--open]="mobileNavOpen()">
    <div class="eks-biz-brand">
      <span class="eks-biz-brand__mark">E</span>
      <span class="eks-biz-brand__text">Eksabli <small>{{ '::BusinessPanel:Layout:BusinessBadge' | abpLocalization }}</small></span>
    </div>
    <nav class="eks-biz-nav">
      @for (item of navItems(); track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          class="eks-biz-nav__link"
          (click)="closeMobileNav()"
        >
          <i class="fas {{ item.icon }}"></i>
          <span>{{ item.labelKey | abpLocalization }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="eks-biz-main flex-grow-1">
    <header class="eks-biz-topbar">
      <button
        type="button"
        class="btn btn-icon d-lg-none"
        [attr.aria-label]="'::BusinessPanel:Layout:ToggleMenu' | abpLocalization"
        (click)="toggleMobileNav()"
      >
        <i class="fas fa-bars"></i>
      </button>

      <div class="flex-grow-1"></div>

      <div class="dropdown">
        <button
          type="button"
          class="btn btn-icon dropdown-toggle"
          [attr.aria-label]="'::BusinessPanel:Layout:ToggleLanguage' | abpLocalization"
          (click)="toggleLangMenu()"
        >
          <i class="fas fa-globe"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" [class.show]="langMenuOpen()">
          @for (lang of languages(); track lang.cultureName) {
            <li>
              <button
                type="button"
                class="dropdown-item"
                [class.active]="lang.cultureName === currentLanguage()"
                (click)="selectLanguage(lang.cultureName)"
              >
                {{ lang.displayName }}
              </button>
            </li>
          }
        </ul>
      </div>

      <button
        type="button"
        class="btn btn-icon"
        [attr.aria-label]="'::BusinessPanel:Layout:ToggleDarkMode' | abpLocalization"
        (click)="toggleDarkMode()"
      >
        <i class="fas" [class.fa-moon]="!darkMode()" [class.fa-sun]="darkMode()"></i>
      </button>

      <app-notification-bell></app-notification-bell>

      <div class="dropdown">
        <button
          type="button"
          class="btn btn-icon dropdown-toggle"
          [attr.aria-expanded]="userMenuOpen()"
          (click)="toggleUserMenu()"
        >
          <i class="fas fa-user-circle"></i>
          <span class="d-none d-sm-inline ms-1">{{ currentUserName() }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" [class.show]="userMenuOpen()">
          <li>
            <button type="button" class="dropdown-item" (click)="logout()">
              {{ 'AbpUi::Logout' | abpLocalization }}
            </button>
          </li>
        </ul>
      </div>
    </header>

    <main class="eks-biz-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
