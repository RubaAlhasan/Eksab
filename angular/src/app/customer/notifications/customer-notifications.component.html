<div class="d-flex justify-content-between align-items-center mb-3">
  <div class="eks-chip-row">
    <button type="button" class="eks-chip" [class.active]="filter() === 'all'" (click)="selectFilter('all')">
      {{ '::Wallet:Notifications:All' | abpLocalization }}
    </button>
    <button type="button" class="eks-chip" [class.active]="filter() === 'unread'" (click)="selectFilter('unread')">
      {{ '::Wallet:Notifications:Unread' | abpLocalization }}
    </button>
  </div>
  @if (hub.hasUnread()) {
    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="markAllAsRead()">
      {{ '::Wallet:Notifications:MarkAllRead' | abpLocalization }}
    </button>
  }
</div>

@if (isLoading()) {
  <app-loading-spinner [label]="'::Wallet:Notifications:Loading' | abpLocalization" />
} @else if (loadFailed()) {
  <app-error-state [message]="'::Wallet:Notifications:LoadError' | abpLocalization" (retry)="retry()" />
} @else if (notifications().length === 0) {
  <app-empty-state icon="fa-bell" [title]="'::Wallet:Notifications:Empty' | abpLocalization" />
} @else {
  <div class="list-group mb-3">
    @for (item of notifications(); track item.id) {
      <button
        type="button"
        class="list-group-item list-group-item-action d-flex align-items-start gap-3"
        [class.eks-unread]="!item.isRead"
        (click)="onItemClick(item)"
      >
        <i class="fas {{ iconFor(item.type) }} mt-1"></i>
        <div class="flex-grow-1 text-start">
          <div class="fw-semibold small">{{ item.title }}</div>
          <div class="text-muted small">{{ item.message }}</div>
          <div class="text-muted small">{{ item.creationTime | date: 'medium' }}</div>
        </div>
        @if (!item.isRead) {
          <span class="eks-unread-dot"></span>
        }
      </button>
    }
  </div>

  <app-pagination [pageIndex]="pageIndex()" [totalPages]="totalPages()" (pageChange)="goToPage($event)" />
}
