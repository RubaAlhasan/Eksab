# Auto-deploy to the VPS.
#
#   push to `production`  ->  production stack  (/opt/eksabli)
#   push to `main`        ->  staging stack     (/opt/eksabli-staging)
#
# Both stacks share one host. They are kept apart by STACK_NAME in each stack's own .env,
# which scopes the compose project (containers, network, volumes), the Traefik router names
# and the Postgres host port -- see deploy/.env.example.
#
# Required repository secrets:
#   VPS_HOST     the server's IP or hostname
#   VPS_SSH_KEY  private half of a deploy key whose public half is in the VPS's
#                ~/.ssh/authorized_keys (see deploy/README.md, "Continuous deployment")
#
# The VPS pulls from GitHub itself, so a private repo needs a deploy key or token configured
# in the clone's remote on the server -- the runner never uploads any source.

name: Deploy

on:
  push:
    branches: [production, main]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

# Serialise deploys per branch. Never cancel in progress: interrupting `docker compose up`
# can leave a half-built stack.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Branch protection and required-reviewer Environments are not available for private repos
  # on the free plan, so the gates live here instead -- in the only thing that can actually
  # reach the servers. A red job means no deploy, which is the property those settings buy.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ancestry check below needs real history

      # Production may only run code that has already been on main, and therefore has already
      # been deployed to staging. This is the free stand-in for "require a PR from main":
      # it cannot be bypassed by pushing straight to production, because the push still has
      # to pass through this job before anything is deployed.
      - name: Production must contain only code that has been on main
        if: github.ref_name == 'production' && github.event_name == 'push'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is contained in main"
          else
            echo "::error::$GITHUB_SHA is not on main. Production takes main only -- merge to main, let staging deploy it, then fast-forward production."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build Eksabli.slnx -c Release

      # The test projects use an in-memory SQLite connection, so no database service is needed.
      - name: Run tests
        run: dotnet test Eksabli.slnx -c Release --no-build --verbosity normal

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Angular
        working-directory: angular
        run: |
          yarn install --frozen-lockfile
          yarn build:prod

  deploy:
    needs: verify            # nothing deploys unless the build and tests passed
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "dir=/opt/eksabli"          >> "$GITHUB_OUTPUT"
            echo "name=production"           >> "$GITHUB_OUTPUT"
            echo "health=https://srv1993275.hstgr.cloud/health-status" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/opt/eksabli-staging"  >> "$GITHUB_OUTPUT"
            echo "name=staging"              >> "$GITHUB_OUTPUT"
            echo "health=https://api-staging.152-239-116-40.sslip.io/health-status" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy ${{ steps.target.outputs.name }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            root@"${{ secrets.VPS_HOST }}" \
            "DIR='${{ steps.target.outputs.dir }}' BRANCH='${{ github.ref_name }}' HEALTH='${{ steps.target.outputs.health }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DIR"
          git fetch --prune origin
          # -f, and a reset before the checkout: the server is a deployment target, never an
          # editing copy, so any local modification is discarded rather than allowed to block
          # the deploy. Without -f a stray `chmod +x` is enough to abort the checkout, and the
          # build then silently rebuilds the OLD source -- which is exactly how three pending
          # migrations went unapplied once.
          # NOT `git clean`: untracked files here include .env and secrets/.
          git reset --hard HEAD
          git checkout -f -B "$BRANCH" "origin/$BRANCH"
          git reset --hard "origin/$BRANCH"
          cd deploy
          docker compose up -d --build
          # Reclaim the layers the rebuild orphaned; without this a 96GB disk fills up.
          docker image prune -f
          docker compose ps
          # `up` exiting 0 only means the containers started -- not that the right code is
          # running or that the schema matches it. This compares the migrations on disk with
          # the ones the database has applied, which is the check that would have caught a
          # deploy silently rebuilding stale source. Non-zero here fails the job.
          ./verify-deploy.sh "$HEALTH"
          REMOTE

      # Second, independent check: the one above runs on the box, this one proves the
      # service is actually reachable from the public internet.
      - name: Verify health
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${{ steps.target.outputs.health }}" || true)
            echo "attempt $i: http=$code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::${{ steps.target.outputs.name }} did not report healthy after deploy"
          exit 1
