<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees — Eksabli Business Portal</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased">
<div id="toast-container"></div>

<div class="flex h-screen overflow-hidden">
  <aside data-sidebar="employees"></aside>
  <div class="drawer-overlay" data-sidebar-drawer-overlay></div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header data-topbar data-title="Employees" data-subtitle="Staff access and branch assignments"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="max-w-screen-2xl mx-auto space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div class="breadcrumbs"><a href="dashboard.html">Business Portal</a><span id="sep1"></span><span class="current">Employees</span></div>
          <button id="invite-btn" class="btn btn-primary btn-sm"><span id="plus-icon"></span>Invite Staff</button>
        </div>

        <div class="card overflow-hidden">
          <div class="table-wrap" style="border:none;border-radius:0">
            <table class="table">
              <thead><tr><th>Name</th><th>Role</th><th>Branch</th><th>Email</th><th>Status</th><th></th></tr></thead>
              <tbody id="employees-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Invite modal -->
<div class="modal-overlay" data-modal="invite">
  <div class="modal-panel p-6" style="max-width:28rem">
    <h3 class="font-bold text-base mb-4">Invite Staff Member</h3>
    <div class="space-y-3">
      <div><label class="field-label">Email address</label><input type="email" class="input" placeholder="name@example.com"></div>
      <div>
        <label class="field-label">Role</label>
        <select class="select"><option>Branch Manager</option><option>Cashier / Redemption Staff</option><option>Marketing Manager</option></select>
      </div>
      <div>
        <label class="field-label">Branch</label>
        <select class="select"><option>All branches</option><option>Downtown</option><option>Marina</option><option>JBR</option></select>
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <button class="btn btn-secondary flex-1" data-modal-close="invite">Cancel</button>
      <button class="btn btn-primary flex-1" id="send-invite-btn">Send Invite</button>
    </div>
  </div>
</div>

<!-- Deactivate confirm modal -->
<div class="modal-overlay" data-modal="deactivate">
  <div class="modal-panel p-6">
    <h3 class="font-bold text-base mb-2">Revoke access?</h3>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">This staff member will immediately lose access to the POS and dashboard.</p>
    <div class="flex gap-3">
      <button class="btn btn-secondary flex-1" data-modal-close="deactivate">Cancel</button>
      <button class="btn btn-danger flex-1" id="confirm-deactivate">Revoke Access</button>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/business-shell.js"></script>
<script>
  const employees = EksabliDemoData.business.employees;
  document.getElementById('sep1').innerHTML = Icons.html('chevron-right', { size: 14 });
  document.getElementById('plus-icon').innerHTML = Icons.html('plus', { size: 14 });

  const statusBadge = { Active: 'badge-success', Invited: 'badge-warning', Suspended: 'badge-danger' };
  document.getElementById('employees-body').innerHTML = employees.map(e => `
    <tr>
      <td>
        <div class="flex items-center gap-3">
          <div class="avatar avatar-sm">${e.name.split(' ').map(w => w[0]).join('')}</div>
          <span class="font-semibold">${e.name}</span>
        </div>
      </td>
      <td class="text-slate-500 dark:text-slate-400">${e.role}</td>
      <td class="text-slate-500 dark:text-slate-400">${e.branch}</td>
      <td class="text-slate-400">${e.email}</td>
      <td><span class="badge ${statusBadge[e.status]}">${e.status}</span></td>
      <td>
        ${e.role !== 'Business Owner' ? `<button class="text-xs font-semibold text-danger-600 dark:text-danger-400 deactivate-btn">Revoke</button>` : ''}
      </td>
    </tr>`).join('');

  document.getElementById('invite-btn').addEventListener('click', () => Eksabli.openModal('invite'));
  document.getElementById('send-invite-btn').addEventListener('click', () => { Eksabli.closeModal('invite'); Eksabli.showToast({ type: 'success', title: 'Invite sent' }); });
  document.querySelectorAll('.deactivate-btn').forEach(btn => btn.addEventListener('click', () => Eksabli.openModal('deactivate')));
  document.getElementById('confirm-deactivate').addEventListener('click', () => { Eksabli.closeModal('deactivate'); Eksabli.showToast({ type: 'danger', title: 'Access revoked' }); });
</script>
</body>
</html>
