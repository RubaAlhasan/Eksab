<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branches — Eksabli Business Portal</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased">
<div id="toast-container"></div>

<div class="flex h-screen overflow-hidden">
  <aside data-sidebar="branches"></aside>
  <div class="drawer-overlay" data-sidebar-drawer-overlay></div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header data-topbar data-title="Branches" data-subtitle="Manage your business locations"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="max-w-screen-2xl mx-auto space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div class="breadcrumbs"><a href="dashboard.html">Business Portal</a><span id="sep1"></span><span class="current">Branches</span></div>
          <button id="add-branch-btn" class="btn btn-primary btn-sm"><span id="plus-icon"></span>Add Branch</button>
        </div>

        <div class="alert alert-info">
          <span id="info-icon"></span>
          <p>Your Growth plan includes up to 5 branches. You currently have 6 — <a href="subscription.html" class="underline font-semibold">upgrade to Scale</a> to avoid overage charges.</p>
        </div>

        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4" id="branches-grid"></div>
      </div>
    </main>
  </div>
</div>

<!-- QR modal -->
<div class="modal-overlay" data-modal="branch-qr">
  <div class="modal-panel p-6 text-center">
    <h3 class="font-bold text-base mb-1" id="qr-branch-name"></h3>
    <p class="text-xs text-slate-400 mb-5">Print or display this at the counter for member check-in</p>
    <div class="w-48 h-48 rounded-2xl bg-slate-900 flex items-center justify-center mx-auto mb-5">
      <div class="grid grid-cols-7 gap-1 p-4" id="qr-pattern"></div>
    </div>
    <div class="flex gap-3">
      <button class="btn btn-secondary flex-1" data-modal-close="branch-qr">Close</button>
      <button class="btn btn-primary flex-1" id="download-qr">Download PNG</button>
    </div>
  </div>
</div>

<!-- Add/edit branch modal -->
<div class="modal-overlay" data-modal="branch-form">
  <div class="modal-panel p-6" style="max-width:30rem">
    <h3 class="font-bold text-base mb-4" id="branch-modal-title">Add Branch</h3>
    <div class="space-y-3">
      <div><label class="field-label">Branch name</label><input class="input" placeholder="e.g. Al Barsha"></div>
      <div><label class="field-label">Address</label><input class="input" placeholder="Street, City"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="field-label">Phone</label><input class="input" placeholder="+971 4 000 0000"></div>
        <div><label class="field-label">Opening hours</label><input class="input" placeholder="9:00 AM – 10:00 PM"></div>
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <button class="btn btn-secondary flex-1" data-modal-close="branch-form">Cancel</button>
      <button class="btn btn-primary flex-1" id="save-branch-btn">Save Branch</button>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/business-shell.js"></script>
<script>
  const branches = EksabliDemoData.business.branches;
  document.getElementById('sep1').innerHTML = Icons.html('chevron-right', { size: 14 });
  document.getElementById('plus-icon').innerHTML = Icons.html('plus', { size: 14 });
  document.getElementById('info-icon').innerHTML = Icons.html('information-circle', { size: 18 });

  document.getElementById('branches-grid').innerHTML = branches.map(b => `
    <div class="card p-5">
      <div class="flex items-start justify-between mb-3">
        <div class="w-10 h-10 rounded-xl bg-primary-50 dark:bg-primary-500/10 text-primary-600 dark:text-primary-300 flex items-center justify-center pin-icon"></div>
        <span class="badge ${b.status === 'Active' ? 'badge-success' : 'badge-neutral'}">${b.status}</span>
      </div>
      <p class="font-bold text-sm mb-1">${b.name}</p>
      <p class="text-xs text-slate-400 mb-1">${b.address}</p>
      <p class="text-xs text-slate-400 mb-4">${b.phone}</p>
      <div class="flex items-center justify-between text-xs mb-4">
        <span class="text-slate-400">Members</span>
        <span class="font-bold">${b.members.toLocaleString()}</span>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-secondary btn-sm flex-1 qr-btn" data-name="${b.name}">QR Code</button>
        <button class="btn btn-icon btn-ghost edit-branch" aria-label="Edit">${Icons.html('pencil-square', { size: 16 })}</button>
      </div>
    </div>`).join('');
  document.querySelectorAll('.pin-icon').forEach(el => el.innerHTML = Icons.html('map-pin', { size: 18 }));

  document.querySelectorAll('.qr-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('qr-branch-name').textContent = btn.getAttribute('data-name') + ' — Check-in QR';
      const grid = document.getElementById('qr-pattern');
      grid.innerHTML = '';
      for (let i = 0; i < 49; i++) grid.innerHTML += `<div class="w-4 h-4 rounded-sm ${Math.random() > 0.45 ? 'bg-white' : 'bg-transparent'}"></div>`;
      Eksabli.openModal('branch-qr');
    });
  });
  document.getElementById('download-qr').addEventListener('click', () => Eksabli.showToast({ type: 'success', title: 'QR code downloaded' }));

  document.getElementById('add-branch-btn').addEventListener('click', () => { document.getElementById('branch-modal-title').textContent = 'Add Branch'; Eksabli.openModal('branch-form'); });
  document.querySelectorAll('.edit-branch').forEach(btn => btn.addEventListener('click', () => { document.getElementById('branch-modal-title').textContent = 'Edit Branch'; Eksabli.openModal('branch-form'); }));
  document.getElementById('save-branch-btn').addEventListener('click', () => { Eksabli.closeModal('branch-form'); Eksabli.showToast({ type: 'success', title: 'Branch saved' }); });
</script>
</body>
</html>
