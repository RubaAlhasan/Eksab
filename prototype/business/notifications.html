<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Eksabli Business Portal</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased">
<div id="toast-container"></div>

<div class="flex h-screen overflow-hidden">
  <aside data-sidebar="notifications"></aside>
  <div class="drawer-overlay" data-sidebar-drawer-overlay></div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header data-topbar data-title="Notifications" data-subtitle="Send messages and review delivery"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="max-w-screen-2xl mx-auto space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div class="breadcrumbs"><a href="dashboard.html">Business Portal</a><span id="sep1"></span><span class="current">Notifications</span></div>
          <button id="compose-btn" class="btn btn-primary btn-sm"><span id="plus-icon"></span>Compose</button>
        </div>

        <div class="grid sm:grid-cols-3 gap-4">
          <div class="card stat-card">
            <p class="text-2xl font-extrabold">1,240</p>
            <p class="text-xs text-slate-500">Sent this month</p>
          </div>
          <div class="card stat-card">
            <p class="text-2xl font-extrabold">64%</p>
            <p class="text-xs text-slate-500">Open rate</p>
          </div>
          <div class="card stat-card">
            <div class="flex items-center justify-between mb-1">
              <p class="text-2xl font-extrabold">640<span class="text-sm text-slate-500 font-semibold">/1,000</span></p>
            </div>
            <p class="text-xs text-slate-500 mb-2">SMS credits used</p>
            <div class="progress-track"><div class="progress-fill" style="width:64%"></div></div>
          </div>
        </div>

        <div class="card p-6">
          <h2 class="font-bold text-sm mb-4">Delivery Log</h2>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Title</th><th>Channel</th><th>Campaign</th><th>Status</th><th>Sent</th></tr></thead>
              <tbody id="log-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Compose modal -->
<div class="modal-overlay" data-modal="compose">
  <div class="modal-panel p-6" style="max-width:32rem">
    <h3 class="font-bold text-base mb-4">Compose Notification</h3>
    <div class="space-y-3">
      <div><label class="field-label">Title</label><input id="compose-title-input" class="input" placeholder="e.g. Weekend offer inside!"><p class="field-error hidden" id="compose-title-error"></p></div>
      <div><label class="field-label">Message</label><textarea id="compose-message-input" class="textarea" rows="3" placeholder="Write your message…"></textarea><p class="field-error hidden" id="compose-message-error"></p></div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Channel</label>
          <select class="select"><option>Push</option><option>Email</option><option>SMS</option><option>In-App</option></select>
        </div>
        <div>
          <label class="field-label">Audience</label>
          <select class="select"><option>All members</option><option>Gold &amp; Platinum</option><option>Inactive 60+ days</option></select>
        </div>
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <button class="btn btn-secondary flex-1" data-modal-close="compose">Cancel</button>
      <button class="btn btn-primary flex-1" id="send-btn">Send Now</button>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/business-shell.js"></script>
<script>
  const data = EksabliDemoData;
  document.getElementById('sep1').innerHTML = Icons.html('chevron-right', { size: 14 });
  document.getElementById('plus-icon').innerHTML = Icons.html('plus', { size: 14 });

  const channelBadge = { Push: 'badge-primary', Email: 'badge-info', SMS: 'badge-warning', InApp: 'badge-neutral' };
  const notifs = data.notifications.filter(n => n.businessId === 'biz_1');
  document.getElementById('log-body').innerHTML = notifs.map(n => `
    <tr>
      <td class="font-semibold">${n.title}</td>
      <td><span class="badge ${channelBadge[n.channel]}">${n.channel}</span></td>
      <td class="text-slate-500">${n.campaignId ? 'Linked' : '—'}</td>
      <td><span class="badge badge-success">Sent</span></td>
      <td class="text-slate-500">${new Date(n.sentAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</td>
    </tr>`).join('');

  document.getElementById('compose-btn').addEventListener('click', () => {
    document.getElementById('compose-title-input').value = '';
    document.getElementById('compose-message-input').value = '';
    ['compose-title-error', 'compose-message-error'].forEach(id => document.getElementById(id).classList.add('hidden'));
    ['compose-title-input', 'compose-message-input'].forEach(id => document.getElementById(id).classList.remove('input-error'));
    Eksabli.openModal('compose');
  });
  document.getElementById('send-btn').addEventListener('click', () => {
    const titleInput = document.getElementById('compose-title-input');
    const messageInput = document.getElementById('compose-message-input');
    const titleError = document.getElementById('compose-title-error');
    const messageError = document.getElementById('compose-message-error');
    let valid = true;
    if (!titleInput.value.trim()) {
      titleError.textContent = 'Title is required.';
      titleError.classList.remove('hidden');
      titleInput.classList.add('input-error');
      valid = false;
    } else {
      titleError.classList.add('hidden');
      titleInput.classList.remove('input-error');
    }
    if (!messageInput.value.trim()) {
      messageError.textContent = 'Message is required.';
      messageError.classList.remove('hidden');
      messageInput.classList.add('input-error');
      valid = false;
    } else {
      messageError.classList.add('hidden');
      messageInput.classList.remove('input-error');
    }
    if (!valid) return;
    Eksabli.closeModal('compose');
    Eksabli.showToast({ type: 'success', title: 'Notification queued', message: 'Delivery will begin within a few minutes.' });
  });
</script>
</body>
</html>
