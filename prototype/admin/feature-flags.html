<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Flags — Eksabli Admin Portal</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased">
<div id="toast-container"></div>

<div class="flex h-screen overflow-hidden">
  <aside data-sidebar="feature-flags"></aside>
  <div class="drawer-overlay" data-sidebar-drawer-overlay></div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header data-topbar data-title="Feature Flags" data-subtitle="Plan entitlements and platform rollout flags"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="max-w-screen-2xl mx-auto space-y-6">
        <div class="breadcrumbs"><a href="dashboard.html">Admin Portal</a><span id="sep1"></span><span class="current">Feature Flags</span></div>

        <div class="alert alert-info">
          <span id="info-icon"></span>
          <p>This is a thin UI over ABP's Feature Management module — not a custom entitlements system. Plan-level limits (branches, members, SMS credits) are managed from <a href="plans.html" class="underline font-semibold">Plans</a>; this page is for platform-wide toggles and staged rollouts.</p>
        </div>

        <div class="card divide-y divide-slate-100 dark:divide-slate-800" id="flags-list"></div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
  const flags = EksabliDemoData.admin.featureFlags;
  document.getElementById('sep1').innerHTML = Icons.html('chevron-right', { size: 14 });
  document.getElementById('info-icon').innerHTML = Icons.html('information-circle', { size: 18 });

  document.getElementById('flags-list').innerHTML = flags.map((f, i) => `
    <div class="flex items-center justify-between gap-4 p-4">
      <div class="min-w-0">
        <p class="text-sm font-semibold">${f.label}</p>
        <p class="text-xs text-slate-400 font-mono">${f.key}</p>
      </div>
      <div class="flex items-center gap-3 flex-shrink-0">
        <span class="badge badge-neutral">${f.rollout}</span>
        <label class="switch"><input type="checkbox" ${f.enabled ? 'checked' : ''} data-idx="${i}" class="flag-toggle"><span class="switch-track"></span></label>
      </div>
    </div>`).join('');

  document.querySelectorAll('.flag-toggle').forEach(input => {
    input.addEventListener('change', () => {
      const flag = flags[input.getAttribute('data-idx')];
      Eksabli.showToast({ type: input.checked ? 'success' : 'info', title: `${flag.label} ${input.checked ? 'enabled' : 'disabled'}` });
    });
  });
</script>
</body>
</html>
