<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscriptions — Eksabli Admin Portal</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased">
<div id="toast-container"></div>

<div class="flex h-screen overflow-hidden">
  <aside data-sidebar="subscriptions"></aside>
  <div class="drawer-overlay" data-sidebar-drawer-overlay></div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header data-topbar data-title="Subscriptions" data-subtitle="Every tenant's plan and billing status"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="max-w-screen-2xl mx-auto space-y-6">
        <div class="breadcrumbs"><a href="dashboard.html">Admin Portal</a><span id="sep1"></span><span class="current">Subscriptions</span></div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="card stat-card"><p class="text-2xl font-extrabold" id="stat-active"></p><p class="text-xs text-slate-400">Active</p></div>
          <div class="card stat-card"><p class="text-2xl font-extrabold" id="stat-trial"></p><p class="text-xs text-slate-400">Trialing</p></div>
          <div class="card stat-card"><p class="text-2xl font-extrabold" id="stat-mrr"></p><p class="text-xs text-slate-400">Total MRR</p></div>
          <div class="card stat-card"><p class="text-2xl font-extrabold" id="stat-churn"></p><p class="text-xs text-slate-400">Churn (30d)</p></div>
        </div>

        <div class="card overflow-hidden">
          <div class="table-wrap" style="border:none;border-radius:0">
            <table class="table">
              <thead><tr><th>Business</th><th>Plan</th><th>MRR</th><th>Renewal</th><th>Status</th></tr></thead>
              <tbody id="subs-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
  const data = EksabliDemoData;
  document.getElementById('sep1').innerHTML = Icons.html('chevron-right', { size: 14 });

  const planPrice = { Starter: 0, Growth: 149, Scale: 449, Enterprise: 1200 };
  const tenants = data.admin.tenants;
  document.getElementById('stat-active').textContent = tenants.filter(t => t.status === 'Active').length;
  document.getElementById('stat-trial').textContent = tenants.filter(t => t.status === 'Trialing').length;
  document.getElementById('stat-mrr').textContent = '$' + data.admin.stats.mrr.toLocaleString();
  document.getElementById('stat-churn').textContent = '1.2%';

  const statusBadge = { Active: 'badge-success', Trialing: 'badge-info', 'Pending Approval': 'badge-warning', Suspended: 'badge-danger' };
  document.getElementById('subs-body').innerHTML = tenants.map(t => `
    <tr>
      <td><a href="business-details.html?id=${t.id}" class="font-semibold hover:text-primary-600 dark:hover:text-primary-400">${t.name}</a></td>
      <td><span class="badge badge-neutral">${t.plan}</span></td>
      <td class="font-semibold">$${(planPrice[t.plan] || 0).toLocaleString()}</td>
      <td class="text-slate-400">Sep 1, 2026</td>
      <td><span class="badge ${statusBadge[t.status]}">${t.status}</span></td>
    </tr>`).join('');
</script>
</body>
</html>
