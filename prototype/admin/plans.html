<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plans — Eksabli Admin Portal</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased">
<div id="toast-container"></div>

<div class="flex h-screen overflow-hidden">
  <aside data-sidebar="plans"></aside>
  <div class="drawer-overlay" data-sidebar-drawer-overlay></div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header data-topbar data-title="Plans" data-subtitle="Subscription plan catalog"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="max-w-screen-2xl mx-auto space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div class="breadcrumbs"><a href="dashboard.html">Admin Portal</a><span id="sep1"></span><span class="current">Plans</span></div>
          <button class="btn btn-primary btn-sm" id="new-plan-btn"><span id="plus-icon"></span>New Plan</button>
        </div>

        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4" id="plans-grid"></div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" data-modal="plan-form">
  <div class="modal-panel p-6" style="max-width:28rem">
    <h3 class="font-bold text-base mb-4" id="plan-modal-title">Edit Plan</h3>
    <div class="space-y-3">
      <div><label class="field-label">Plan name</label><input class="input" id="edit-plan-name"><p class="field-error hidden" id="edit-plan-name-error"></p></div>
      <div><label class="field-label">Monthly price ($) <span class="text-slate-400 font-normal">(blank = custom pricing)</span></label><input type="number" class="input" id="edit-plan-price"><p class="field-error hidden" id="edit-plan-price-error"></p></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="field-label">Branch limit</label><input class="input" id="edit-plan-branches"></div>
        <div><label class="field-label">Member limit</label><input class="input" id="edit-plan-members"></div>
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <button class="btn btn-secondary flex-1" data-modal-close="plan-form">Cancel</button>
      <button class="btn btn-primary flex-1" id="save-plan-btn">Save Plan</button>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
  const plans = EksabliDemoData.admin.plans;
  document.getElementById('sep1').innerHTML = Icons.html('chevron-right', { size: 14 });
  document.getElementById('plus-icon').innerHTML = Icons.html('plus', { size: 14 });

  document.getElementById('plans-grid').innerHTML = plans.map(p => `
    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <p class="font-bold text-sm">${p.name}</p>
        <span class="badge badge-neutral">${p.tenants} tenants</span>
      </div>
      <p class="text-2xl font-extrabold mb-4">${p.price !== null ? '$' + p.price : 'Custom'}<span class="text-xs text-slate-400 font-semibold">${p.price !== null ? '/mo' : ''}</span></p>
      <div class="space-y-1.5 text-xs text-slate-500 dark:text-slate-400 mb-4">
        <p>${p.branches} branches</p>
        <p>${typeof p.members === 'number' ? p.members.toLocaleString() : p.members} active members</p>
        <p>${p.campaigns} campaigns</p>
        <p>${p.notifications}</p>
      </div>
      <button class="btn btn-secondary btn-sm w-full edit-plan-btn" data-name="${p.name}" data-price="${p.price}">Edit Plan</button>
    </div>`).join('');

  function resetPlanErrors() {
    ['edit-plan-name-error', 'edit-plan-price-error'].forEach(id => document.getElementById(id).classList.add('hidden'));
    ['edit-plan-name', 'edit-plan-price'].forEach(id => document.getElementById(id).classList.remove('input-error'));
  }
  document.querySelectorAll('.edit-plan-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('plan-modal-title').textContent = 'Edit ' + btn.getAttribute('data-name') + ' Plan';
      document.getElementById('edit-plan-name').value = btn.getAttribute('data-name');
      document.getElementById('edit-plan-price').value = btn.getAttribute('data-price') === 'null' ? '' : btn.getAttribute('data-price');
      resetPlanErrors();
      Eksabli.openModal('plan-form');
    });
  });
  document.getElementById('new-plan-btn').addEventListener('click', () => {
    document.getElementById('plan-modal-title').textContent = 'New Plan';
    document.getElementById('edit-plan-name').value = '';
    document.getElementById('edit-plan-price').value = '';
    resetPlanErrors();
    Eksabli.openModal('plan-form');
  });
  document.getElementById('save-plan-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('edit-plan-name');
    const priceInput = document.getElementById('edit-plan-price');
    const nameError = document.getElementById('edit-plan-name-error');
    const priceError = document.getElementById('edit-plan-price-error');
    let valid = true;
    if (!nameInput.value.trim()) {
      nameError.textContent = 'Plan name is required.';
      nameError.classList.remove('hidden');
      nameInput.classList.add('input-error');
      valid = false;
    } else {
      nameError.classList.add('hidden');
      nameInput.classList.remove('input-error');
    }
    if (priceInput.value !== '' && (isNaN(parseFloat(priceInput.value)) || parseFloat(priceInput.value) < 0)) {
      priceError.textContent = 'Enter a valid price of 0 or more, or leave blank for custom pricing.';
      priceError.classList.remove('hidden');
      priceInput.classList.add('input-error');
      valid = false;
    } else {
      priceError.classList.add('hidden');
      priceInput.classList.remove('input-error');
    }
    if (!valid) return;
    Eksabli.closeModal('plan-form');
    Eksabli.showToast({ type: 'success', title: 'Plan saved' });
  });
</script>
</body>
</html>
