<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs — Eksabli Admin Portal</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased">
<div id="toast-container"></div>

<div class="flex h-screen overflow-hidden">
  <aside data-sidebar="audit-logs"></aside>
  <div class="drawer-overlay" data-sidebar-drawer-overlay></div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header data-topbar data-title="Audit Logs" data-subtitle="Who did what, across the platform"></header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="max-w-screen-2xl mx-auto space-y-6">
        <div class="breadcrumbs"><a href="dashboard.html">Admin Portal</a><span id="sep1"></span><span class="current">Audit Logs</span></div>

        <div class="card p-4 flex flex-wrap items-center gap-3">
          <div class="relative flex-1 min-w-[220px]">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" id="search-icon"></span>
            <input id="search-input" class="input pl-9" placeholder="Search by actor or action…">
          </div>
          <input type="date" class="input w-40">
        </div>

        <div class="card overflow-hidden">
          <div class="table-wrap" style="border:none;border-radius:0">
            <table class="table">
              <thead><tr><th>Actor</th><th>Action</th><th>Target</th><th>Timestamp</th></tr></thead>
              <tbody id="log-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
  const logs = EksabliDemoData.admin.auditLogs;
  document.getElementById('sep1').innerHTML = Icons.html('chevron-right', { size: 14 });
  document.getElementById('search-icon').innerHTML = Icons.html('search', { size: 16 });

  function render() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const filtered = logs.filter(l => !q || `${l.actor} ${l.action}`.toLowerCase().includes(q));
    document.getElementById('log-body').innerHTML = filtered.map(l => `
      <tr>
        <td class="font-mono text-xs text-slate-500 dark:text-slate-400">${l.actor}</td>
        <td class="font-semibold">${l.action}</td>
        <td class="text-slate-500 dark:text-slate-400">${l.target}</td>
        <td class="text-slate-400">${new Date(l.timestamp).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
      </tr>`).join('');
  }
  document.getElementById('search-input').addEventListener('input', render);
  render();
</script>
</body>
</html>
