<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-slate-50 dark:bg-slate-950">
    <div data-status-bar></div>

    <div class="px-5 pt-3 pb-3">
      <h1 class="text-xl font-extrabold tracking-tight mb-3">Search</h1>
      <div class="relative">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" id="search-icon"></span>
        <input id="search-input" class="input pl-10" placeholder="Search businesses, categories…" autofocus>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-5 pb-6">

      <!-- Recent searches (shown when input empty) -->
      <div id="recent-view">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wide text-slate-400">Recent searches</h2>
          <button id="clear-recent" class="text-xs font-semibold text-primary-600 dark:text-primary-400">Clear</button>
        </div>
        <div class="flex flex-wrap gap-2 mb-6" id="recent-chips"></div>

        <h2 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Browse by category</h2>
        <div class="grid grid-cols-2 gap-3" id="category-tiles"></div>
      </div>

      <!-- Results -->
      <div id="results-view" class="hidden space-y-3"></div>

      <!-- Empty -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-state-icon" id="empty-icon"></div>
        <p class="font-bold text-sm mb-1">No results found</p>
        <p class="text-xs text-slate-400 max-w-[16rem]">Try a different name or category.</p>
      </div>
    </div>

    <div data-bottom-nav="search"></div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  const data = EksabliDemoData;
  document.getElementById('search-icon').innerHTML = Icons.html('search', { size: 18 });
  document.getElementById('empty-icon').innerHTML = Icons.html('search', { size: 26 });

  const recent = ['Cedar & Bean Coffee', 'Fitness', 'Bookshop'];
  document.getElementById('recent-chips').innerHTML = recent.map(r => `<button class="badge badge-neutral recent-chip cursor-pointer">${r}</button>`).join('');
  document.getElementById('clear-recent').addEventListener('click', () => { document.getElementById('recent-chips').innerHTML = ''; });

  const categories = [...new Set(data.businesses.map(b => b.category))];
  document.getElementById('category-tiles').innerHTML = categories.map(c => `
    <button class="cat-tile card card-hover p-4 text-left" data-cat="${c}">
      <p class="text-sm font-bold">${c}</p>
      <p class="text-xs text-slate-400 mt-0.5">${data.businesses.filter(b => b.category === c).length} businesses</p>
    </button>`).join('');

  const input = document.getElementById('search-input');
  const recentView = document.getElementById('recent-view');
  const resultsView = document.getElementById('results-view');
  const emptyState = document.getElementById('empty-state');

  function runSearch(q) {
    q = q.trim().toLowerCase();
    if (!q) {
      recentView.classList.remove('hidden');
      resultsView.classList.add('hidden');
      emptyState.classList.add('hidden');
      return;
    }
    recentView.classList.add('hidden');
    const filtered = data.businesses.filter(b => b.name.toLowerCase().includes(q) || b.category.toLowerCase().includes(q));
    if (filtered.length === 0) {
      resultsView.classList.add('hidden');
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');
    resultsView.classList.remove('hidden');
    resultsView.innerHTML = filtered.map(biz => `
      <a href="store-details.html?id=${biz.id}" class="card card-hover p-4 flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${biz.color} flex items-center justify-center text-white font-bold flex-shrink-0">${biz.initials}</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold truncate">${biz.name}</p>
          <p class="text-xs text-slate-400">${biz.category} · ${biz.distanceKm} km</p>
        </div>
        ${biz.member ? '<span class="badge badge-primary flex-shrink-0">Member</span>' : ''}
      </a>`).join('');
  }

  input.addEventListener('input', () => runSearch(input.value));
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('recent-chip') || e.target.classList.contains('cat-tile') || e.target.closest('.cat-tile')) {
      const tile = e.target.closest('.cat-tile');
      input.value = tile ? tile.getAttribute('data-cat') : e.target.textContent;
      runSearch(input.value);
    }
  });
</script>
</body>
</html>
