<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-gradient-to-b from-primary-600 to-primary-800 text-white">

    <div class="flex-1 flex flex-col items-center justify-center px-8 text-center">
      <div class="w-20 h-20 rounded-3xl bg-white/15 backdrop-blur flex items-center justify-center text-4xl font-extrabold mb-6 animate-fade-up shadow-soft-lg">E</div>
      <h1 class="text-3xl font-extrabold tracking-tight mb-2 animate-fade-up" style="animation-delay:.05s">Eksabli</h1>
      <p class="text-white/70 text-sm animate-fade-up" style="animation-delay:.1s">Collect points everywhere you shop</p>
    </div>

    <div class="pb-12 flex flex-col items-center gap-4">
      <div class="flex items-center gap-1.5" aria-hidden="true">
        <span class="w-2 h-2 rounded-full bg-white/40 animate-pulse" style="animation-delay:0ms"></span>
        <span class="w-2 h-2 rounded-full bg-white/70 animate-pulse" style="animation-delay:150ms"></span>
        <span class="w-2 h-2 rounded-full bg-white animate-pulse" style="animation-delay:300ms"></span>
      </div>
      <a href="onboarding.html" class="text-xs text-white/50 hover:text-white/80 transition-colors" id="skip-link">Tap to continue</a>
    </div>
  </div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
