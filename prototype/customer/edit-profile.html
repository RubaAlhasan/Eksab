<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-white dark:bg-slate-950">
    <div data-status-bar></div>
    <div data-top-bar data-title="Edit Profile" data-back="profile.html"></div>

    <div class="flex-1 overflow-y-auto px-6 py-5">
      <div class="flex flex-col items-center mb-6">
        <div class="relative">
          <div class="avatar avatar-xl" id="avatar"></div>
          <button class="absolute -bottom-1 -right-1 btn btn-icon btn-primary" style="padding:.4rem" id="change-photo" aria-label="Change photo"></button>
        </div>
        <p class="text-xs text-slate-400 mt-2">Tap to change photo</p>
      </div>

      <form id="edit-form" novalidate class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="field-label" for="firstName">First name</label>
            <input id="firstName" class="input">
            <p class="field-error hidden" data-error-for="firstName"></p>
          </div>
          <div>
            <label class="field-label" for="lastName">Last name</label>
            <input id="lastName" class="input">
          </div>
        </div>
        <div>
          <label class="field-label" for="phone">Phone number</label>
          <input id="phone" class="input">
          <p class="field-error hidden" data-error-for="phone"></p>
        </div>
        <div>
          <label class="field-label" for="email">Email</label>
          <input id="email" type="email" class="input">
          <p class="field-error hidden" data-error-for="email"></p>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="field-label" for="dob">Date of birth</label>
            <input id="dob" type="date" class="input">
          </div>
          <div>
            <label class="field-label" for="gender">Gender</label>
            <select id="gender" class="select">
              <option>Female</option><option>Male</option><option>Prefer not to say</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <div class="px-6 pb-8 pt-2 border-t border-slate-100 dark:border-slate-800">
      <button id="save-btn" class="btn btn-primary btn-lg w-full">
        <span id="save-label">Save Changes</span>
      </button>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  const c = EksabliDemoData.currentCustomer;
  document.getElementById('avatar').textContent = c.initials;
  document.getElementById('change-photo').innerHTML = Icons.html('pencil-square', { size: 12 });
  document.getElementById('firstName').value = c.firstName;
  document.getElementById('lastName').value = c.lastName;
  document.getElementById('phone').value = c.phone;
  document.getElementById('email').value = c.email;
  document.getElementById('dob').value = c.dateOfBirth;
  document.getElementById('gender').value = c.gender;

  function setError(field, message) {
    const el = document.querySelector(`[data-error-for="${field}"]`);
    const input = document.getElementById(field);
    if (message) { el.textContent = message; el.classList.remove('hidden'); input.classList.add('input-error'); }
    else { el.classList.add('hidden'); input.classList.remove('input-error'); }
  }

  document.getElementById('save-btn').addEventListener('click', () => {
    let valid = true;
    setError('firstName', document.getElementById('firstName').value.trim() ? '' : 'Required'); valid = valid && !!document.getElementById('firstName').value.trim();
    const email = document.getElementById('email').value.trim();
    setError('email', !email || /.+@.+\..+/.test(email) ? '' : 'Enter a valid email.'); valid = valid && (!email || /.+@.+\..+/.test(email));
    if (!valid) return;

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    document.getElementById('save-label').innerHTML = `<span class="inline-flex items-center gap-2"><svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>Saving…</span>`;
    setTimeout(() => { window.location.href = 'profile.html'; }, 900);
  });
</script>
</body>
</html>
