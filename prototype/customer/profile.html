<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-slate-50 dark:bg-slate-950">
    <div data-status-bar></div>

    <div class="px-5 pt-3 pb-5">
      <h1 class="text-xl font-extrabold tracking-tight mb-4">Profile</h1>
      <div class="card p-5 flex items-center gap-4">
        <div class="avatar avatar-lg" id="avatar"></div>
        <div class="flex-1 min-w-0">
          <p class="font-bold text-base truncate" id="name"></p>
          <p class="text-xs text-slate-400 truncate" id="email"></p>
          <p class="text-xs text-slate-400" id="member-since"></p>
        </div>
        <a href="edit-profile.html" class="btn btn-icon btn-secondary" id="edit-btn" aria-label="Edit profile"></a>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-5 pb-6 space-y-5">
      <section>
        <p class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2 px-1">Your Activity</p>
        <div class="card divide-y divide-slate-100 dark:divide-slate-800">
          <a href="my-memberships.html" class="flex items-center gap-3 p-4"><span class="icon-slot text-slate-400" data-icon="building-storefront"></span><span class="flex-1 text-sm font-semibold">My Memberships</span><span class="text-slate-300" data-icon="chevron-right"></span></a>
          <a href="coupons.html" class="flex items-center gap-3 p-4"><span class="icon-slot text-slate-400" data-icon="ticket"></span><span class="flex-1 text-sm font-semibold">My Coupons</span><span class="text-slate-300" data-icon="chevron-right"></span></a>
          <a href="favorites.html" class="flex items-center gap-3 p-4"><span class="icon-slot text-slate-400" data-icon="heart"></span><span class="flex-1 text-sm font-semibold">Favorites</span><span class="text-slate-300" data-icon="chevron-right"></span></a>
          <a href="referral.html" class="flex items-center gap-3 p-4"><span class="icon-slot text-slate-400" data-icon="gift"></span><span class="flex-1 text-sm font-semibold">Refer Friends</span><span class="text-slate-300" data-icon="chevron-right"></span></a>
          <a href="birthday-rewards.html" class="flex items-center gap-3 p-4"><span class="icon-slot text-slate-400" data-icon="calendar"></span><span class="flex-1 text-sm font-semibold">Birthday Rewards</span><span class="text-slate-300" data-icon="chevron-right"></span></a>
        </div>
      </section>

      <section>
        <p class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2 px-1">Preferences</p>
        <div class="card divide-y divide-slate-100 dark:divide-slate-800">
          <a href="settings.html" class="flex items-center gap-3 p-4"><span class="icon-slot text-slate-400" data-icon="cog-6-tooth"></span><span class="flex-1 text-sm font-semibold">Settings</span><span class="text-slate-300" data-icon="chevron-right"></span></a>
          <a href="help.html" class="flex items-center gap-3 p-4"><span class="icon-slot text-slate-400" data-icon="information-circle"></span><span class="flex-1 text-sm font-semibold">Help & Support</span><span class="text-slate-300" data-icon="chevron-right"></span></a>
        </div>
      </section>

      <button id="logout-btn" class="btn btn-secondary w-full text-danger-600 dark:text-danger-400">
        <span id="logout-icon"></span> Log Out
      </button>
      <p class="text-center text-xs text-slate-300 dark:text-slate-700">Eksabli v1.0.0 (MVP Prototype)</p>
    </div>

    <div data-bottom-nav="profile"></div>
  </div>
</div>

<!-- Logout confirmation modal -->
<div class="modal-overlay" data-modal="logout">
  <div class="modal-panel p-6">
    <h3 class="font-bold text-base mb-2">Log out of Eksabli?</h3>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">You'll need your phone number and password (or OTP) to log back in.</p>
    <div class="flex gap-3">
      <button class="btn btn-secondary flex-1" data-modal-close="logout">Cancel</button>
      <a href="login.html" class="btn btn-danger flex-1">Log Out</a>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  const c = EksabliDemoData.currentCustomer;
  document.getElementById('avatar').textContent = c.initials;
  document.getElementById('name').textContent = c.firstName + ' ' + c.lastName;
  document.getElementById('email').textContent = c.email;
  document.getElementById('member-since').textContent = 'Member since ' + new Date(c.memberSince).toLocaleDateString(undefined, { year: 'numeric', month: 'short' });
  document.getElementById('edit-btn').innerHTML = Icons.html('pencil-square', { size: 16 });
  document.getElementById('logout-icon').innerHTML = Icons.html('arrow-right-on-rectangle', { size: 18 });
  document.querySelectorAll('.icon-slot').forEach(el => { el.innerHTML = Icons.html(el.getAttribute('data-icon'), { size: 18 }); });
  document.getElementById('logout-btn').addEventListener('click', () => Eksabli.openModal('logout'));
</script>
</body>
</html>
