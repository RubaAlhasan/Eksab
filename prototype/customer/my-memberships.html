<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Memberships — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-slate-50 dark:bg-slate-950">
    <div data-status-bar></div>
    <div data-top-bar data-title="My Memberships" data-back="profile.html"></div>

    <div class="flex-1 overflow-y-auto px-5 py-4">
      <p class="text-xs text-slate-400 mb-4">Every business you've joined, and its membership status.</p>
      <div id="list" class="space-y-3"></div>
    </div>

    <div data-bottom-nav=""></div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  const data = EksabliDemoData;
  document.querySelector('[data-bottom-nav]')?.remove();

  function businessById(id) { return data.businesses.find(b => b.id === id); }
  function fmtDate(d) { return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }

  document.getElementById('list').innerHTML = data.memberships.map(m => {
    const biz = businessById(m.businessId);
    return `
      <a href="my-points.html?id=${biz.id}" class="card card-hover p-4 flex items-center gap-4">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br ${biz.color} flex items-center justify-center text-white font-bold flex-shrink-0 text-sm">${biz.initials}</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold truncate">${biz.name}</p>
          <p class="text-xs text-slate-400">Joined ${fmtDate(m.joinedAt)} · ${biz.category}</p>
        </div>
        <span class="badge ${m.status === 'Active' ? 'badge-success' : 'badge-neutral'} flex-shrink-0">${m.status}</span>
      </a>`;
  }).join('');
</script>
</body>
</html>
