<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-slate-50 dark:bg-slate-950">
    <div data-status-bar></div>

    <div class="flex items-center justify-between px-5 pt-2 pb-3">
      <h1 class="text-xl font-extrabold tracking-tight">Notifications</h1>
      <button id="mark-all-btn" class="text-xs font-semibold text-primary-600 dark:text-primary-400">Mark all read</button>
    </div>

    <div class="flex-1 overflow-y-auto px-5 pb-4">
      <div id="list" class="space-y-2"></div>
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-state-icon" id="empty-icon"></div>
        <p class="font-bold text-sm mb-1">You're all caught up</p>
        <p class="text-xs text-slate-400 max-w-[16rem]">New notifications from your businesses will appear here.</p>
      </div>
    </div>

    <div data-bottom-nav="notifications"></div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  const data = EksabliDemoData;
  document.getElementById('empty-icon').innerHTML = Icons.html('bell', { size: 26 });

  const channelIcon = { Push: 'bell', Email: 'envelope', SMS: 'phone', InApp: 'sparkles' };
  let notifications = [...data.notifications];

  function render() {
    const list = document.getElementById('list');
    const empty = document.getElementById('empty-state');
    if (notifications.length === 0) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    list.innerHTML = notifications.sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt)).map(n => {
      const biz = data.businesses.find(b => b.id === n.businessId);
      return `
        <div class="card p-4 flex items-start gap-3 ${n.read ? '' : 'bg-primary-50/50 dark:bg-primary-500/5 border-primary-100 dark:border-primary-500/20'}" data-id="${n.id}">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br ${biz.color} flex items-center justify-center text-white text-xs font-bold flex-shrink-0">${biz.initials}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-0.5">
              <p class="text-sm font-bold truncate">${n.title}</p>
              ${!n.read ? '<span class="w-2 h-2 rounded-full bg-primary-600 flex-shrink-0"></span>' : ''}
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-1.5">${n.body}</p>
            <div class="flex items-center gap-2 text-[11px] text-slate-400">
              <span class="channel-icon"></span>
              <span>${n.channel}</span>
              <span>·</span>
              <span>${new Date(n.sentAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
            </div>
          </div>
        </div>`;
    }).join('');
    list.querySelectorAll('.channel-icon').forEach((el, i) => {
      const n = notifications[i];
      el.innerHTML = Icons.html(channelIcon[n.channel] || 'bell', { size: 12 });
    });
    list.querySelectorAll('[data-id]').forEach(card => {
      card.addEventListener('click', () => {
        const n = notifications.find(x => x.id === card.getAttribute('data-id'));
        if (n) { n.read = true; render(); }
      });
    });
  }

  document.getElementById('mark-all-btn').addEventListener('click', () => {
    notifications.forEach(n => n.read = true);
    render();
    Eksabli.showToast({ type: 'success', title: 'All notifications marked as read' });
  });

  render();
</script>
</body>
</html>
