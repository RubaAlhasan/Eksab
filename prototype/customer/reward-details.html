<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Details — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-white dark:bg-slate-950">
    <div data-status-bar></div>
    <div id="top-bar-slot" data-top-bar data-title="Reward Details" data-back="javascript:history.back()"></div>

    <div class="flex-1 overflow-y-auto px-6 py-6">
      <div class="text-7xl text-center mb-6" id="reward-emoji"></div>
      <h1 class="text-xl font-extrabold text-center mb-1" id="reward-name"></h1>
      <p class="text-center text-sm text-slate-400 mb-6" id="reward-biz"></p>

      <div class="card p-4 flex items-center justify-between mb-4">
        <div>
          <p class="text-xs text-slate-400">Cost</p>
          <p class="text-lg font-extrabold text-primary-600 dark:text-primary-400" id="reward-cost"></p>
        </div>
        <div class="text-right">
          <p class="text-xs text-slate-400">Your balance</p>
          <p class="text-lg font-extrabold" id="user-balance"></p>
        </div>
      </div>

      <div id="afford-alert" class="alert alert-warning mb-4 hidden">
        <span id="warn-icon"></span>
        <p>You need <span id="points-needed" class="font-bold"></span> more points to redeem this reward.</p>
      </div>

      <section class="mb-6">
        <h2 class="text-sm font-bold mb-2">Description</h2>
        <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed" id="reward-description"></p>
      </section>

      <section class="mb-6">
        <h2 class="text-sm font-bold mb-2">Terms</h2>
        <ul class="text-sm text-slate-500 dark:text-slate-400 space-y-1.5 list-disc list-inside">
          <li>Valid until <span id="valid-to"></span></li>
          <li>One redemption per coupon code</li>
          <li>Cannot be combined with other offers</li>
          <li>Non-transferable and non-refundable once redeemed</li>
        </ul>
      </section>
    </div>

    <div class="px-6 pb-8 pt-2 border-t border-slate-100 dark:border-slate-800">
      <a href="#" id="redeem-btn" class="btn btn-primary btn-lg w-full">Redeem Now</a>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  const data = EksabliDemoData;
  const params = new URLSearchParams(location.search);
  const reward = data.rewards.find(r => r.id === params.get('id')) || data.rewards[0];
  const biz = data.businesses.find(b => b.id === reward.businessId);
  const m = data.memberships.find(mm => mm.businessId === biz.id) || { balance: 0 };

  document.getElementById('warn-icon').innerHTML = Icons.html('exclamation-triangle', { size: 18 });
  document.getElementById('reward-emoji').textContent = reward.image;
  document.getElementById('reward-name').textContent = reward.name;
  document.getElementById('reward-biz').textContent = biz.name;
  document.getElementById('reward-cost').textContent = reward.pointsCost + ' pts';
  document.getElementById('user-balance').textContent = m.balance.toLocaleString() + ' pts';
  document.getElementById('reward-description').textContent = `Redeem your points for ${reward.name.toLowerCase()} at any ${biz.name} branch. Show your redemption QR or PIN to staff at checkout to claim.`;
  document.getElementById('valid-to').textContent = new Date(reward.validTo).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

  const affordable = m.balance >= reward.pointsCost;
  const redeemBtn = document.getElementById('redeem-btn');
  if (affordable) {
    redeemBtn.href = `redeem-reward.html?id=${reward.id}`;
  } else {
    redeemBtn.classList.add('opacity-50', 'pointer-events-none');
    redeemBtn.textContent = 'Not Enough Points';
    document.getElementById('afford-alert').classList.remove('hidden');
    document.getElementById('points-needed').textContent = (reward.pointsCost - m.balance).toLocaleString();
  }
</script>
</body>
</html>
