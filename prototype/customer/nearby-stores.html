<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby Stores — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-slate-50 dark:bg-slate-950">
    <div data-status-bar></div>
    <div data-top-bar data-title="Nearby Stores" data-back="home.html"></div>

    <div class="px-5 pt-4 pb-2 flex items-center justify-between gap-3">
      <div class="tabs-pill" id="view-toggle">
        <span class="tab-pill-trigger active" data-view="list">List</span>
        <span class="tab-pill-trigger" data-view="map">Map</span>
      </div>
      <button class="btn btn-icon btn-secondary" id="filter-btn" aria-label="Filter"></button>
    </div>

    <div class="px-5 pb-3">
      <div class="flex gap-2 overflow-x-auto no-scrollbar" id="category-chips"></div>
    </div>

    <div class="flex-1 overflow-y-auto px-5 pb-6">

      <!-- Map placeholder -->
      <div id="map-view" class="hidden">
        <div class="rounded-2xl h-64 bg-gradient-to-br from-primary-100 to-primary-200 dark:from-primary-900/40 dark:to-primary-950 flex items-center justify-center relative overflow-hidden mb-4">
          <span class="absolute inset-0 opacity-20" style="background-image:radial-gradient(circle,#6248E3 1px,transparent 1px);background-size:16px 16px;"></span>
          <div class="relative text-center">
            <div class="w-10 h-10 mx-auto mb-2 text-primary-600 dark:text-primary-300" id="map-pin-icon"></div>
            <p class="text-xs font-semibold text-primary-700 dark:text-primary-300">Map view (placeholder)</p>
          </div>
        </div>
      </div>

      <!-- Skeleton -->
      <div id="skeleton" class="space-y-3">
        <div class="skeleton h-24 rounded-2xl"></div>
        <div class="skeleton h-24 rounded-2xl"></div>
        <div class="skeleton h-24 rounded-2xl"></div>
      </div>

      <!-- List -->
      <div id="store-list" class="hidden space-y-3"></div>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-state-icon" id="empty-icon"></div>
        <p class="font-bold text-sm mb-1">No stores in this category</p>
        <p class="text-xs text-slate-500 max-w-[16rem]">Try a different category, or clear the filter to see everything nearby.</p>
        <button id="clear-filter" class="btn btn-outline btn-sm mt-4">Clear filter</button>
      </div>
    </div>

    <div data-bottom-nav="home"></div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  const data = EksabliDemoData;
  document.getElementById('filter-btn').innerHTML = Icons.html('funnel', { size: 18 });
  document.getElementById('map-pin-icon').innerHTML = Icons.html('map-pin', { size: 40 });
  document.getElementById('empty-icon').innerHTML = Icons.html('building-storefront', { size: 26 });

  const categories = ['All', ...new Set(data.businesses.map(b => b.category))];
  const chipWrap = document.getElementById('category-chips');
  let activeCategory = 'All';

  function renderChips() {
    chipWrap.innerHTML = categories.map(c => `
      <button data-cat="${c}" class="tab-pill-trigger ${c === activeCategory ? 'active' : ''} flex-shrink-0" style="background:${c === activeCategory ? '' : 'transparent'}">${c}</button>
    `).join('');
    chipWrap.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => { activeCategory = btn.getAttribute('data-cat'); renderChips(); renderList(); });
    });
  }

  function renderList() {
    const list = document.getElementById('store-list');
    const empty = document.getElementById('empty-state');
    const filtered = data.businesses.filter(b => activeCategory === 'All' || b.category === activeCategory)
      .sort((a, b) => a.distanceKm - b.distanceKm);
    if (filtered.length === 0) {
      list.classList.add('hidden'); empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden'); list.classList.remove('hidden');
    list.innerHTML = filtered.map(biz => `
      <a href="store-details.html?id=${biz.id}" class="store-card card card-hover p-4 flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${biz.color} flex items-center justify-center text-white font-bold flex-shrink-0">${biz.initials}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <p class="text-sm font-bold truncate">${biz.name}</p>
            ${biz.member ? '<span class="badge badge-primary flex-shrink-0">Member</span>' : ''}
          </div>
          <p class="text-xs text-slate-500 mb-1.5">${biz.category} · ${biz.branches} branches</p>
          <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
            <span class="flex items-center gap-1"><span class="text-warning-500">★</span> ${biz.rating}</span>
            <span>${biz.distanceKm} km away</span>
          </div>
        </div>
      </a>`).join('');
  }

  document.getElementById('clear-filter').addEventListener('click', () => { activeCategory = 'All'; renderChips(); renderList(); });

  document.querySelectorAll('#view-toggle [data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#view-toggle [data-view]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const isMap = btn.getAttribute('data-view') === 'map';
      document.getElementById('map-view').classList.toggle('hidden', !isMap);
    });
  });

  renderChips();
  setTimeout(() => {
    document.getElementById('skeleton').classList.add('hidden');
    renderList();
  }, 500);
</script>
</body>
</html>
