<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favorites — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-slate-50 dark:bg-slate-950">
    <div data-status-bar></div>
    <div data-top-bar data-title="Favorites" data-back="profile.html"></div>

    <div class="flex-1 overflow-y-auto px-5 py-4">
      <p class="text-xs text-slate-500 mb-4">Businesses you're following but haven't joined yet.</p>
      <div id="list" class="space-y-3"></div>
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-state-icon" id="empty-icon"></div>
        <p class="font-bold text-sm mb-1">No favorites yet</p>
        <p class="text-xs text-slate-500 max-w-[16rem] mb-4">Tap the heart on any store's profile to follow it and see their offers here.</p>
        <a href="nearby-stores.html" class="btn btn-primary btn-sm">Discover businesses</a>
      </div>
    </div>

    <div data-bottom-nav=""></div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  const data = EksabliDemoData;
  document.querySelector('[data-bottom-nav]')?.remove();
  document.getElementById('empty-icon').innerHTML = Icons.html('heart', { size: 26 });

  const favorites = data.businesses.filter(b => b.following && !b.member);
  const list = document.getElementById('list');
  if (favorites.length === 0) {
    document.getElementById('empty-state').classList.remove('hidden');
  } else {
    list.innerHTML = favorites.map(biz => `
      <div class="card p-4 flex items-center gap-4">
        <a href="store-details.html?id=${biz.id}" class="flex items-center gap-4 flex-1 min-w-0">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${biz.color} flex items-center justify-center text-white font-bold flex-shrink-0">${biz.initials}</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold truncate">${biz.name}</p>
            <p class="text-xs text-slate-500">${biz.category} · ${biz.distanceKm} km</p>
          </div>
        </a>
        <button class="btn btn-icon btn-ghost text-danger-500 unfollow-btn" data-id="${biz.id}" aria-label="Unfollow">${Icons.html('heart-solid', { size: 18 })}</button>
      </div>`).join('');
    list.querySelectorAll('.unfollow-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.closest('.card').remove();
        Eksabli.showToast({ type: 'info', title: 'Removed from favorites' });
      });
    });
  }
</script>
</body>
</html>
