<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Eksabli</title>

<script src="../assets/js/tailwind-config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.EksabliTailwindConfig;</script>
<link rel="stylesheet" href="../assets/css/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="phone-frame-wrap">
<div id="toast-container"></div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen bg-white dark:bg-slate-950">
    <div data-status-bar></div>

    <div class="flex items-center gap-3 px-5 pt-2 pb-4">
      <a href="login.html" class="btn btn-icon btn-ghost -ml-2" aria-label="Back"></a>
    </div>

    <!-- Request state -->
    <div id="request-view" class="flex-1 flex flex-col px-6">
      <div class="w-16 h-16 rounded-2xl bg-warning-50 dark:bg-warning-500/10 flex items-center justify-center text-warning-600 dark:text-warning-300 mb-6" id="lock-icon"></div>
      <h1 class="text-2xl font-extrabold tracking-tight mb-1">Reset your password</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Enter the phone number or email on your account and we'll send reset instructions.</p>

      <form id="reset-form" novalidate class="space-y-4">
        <div>
          <label class="field-label" for="identifier">Phone or email</label>
          <input id="identifier" class="input" placeholder="+971 50 123 4567">
          <p class="field-error hidden" data-error-for="identifier"></p>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg w-full">
          <span id="submit-label">Send reset instructions</span>
        </button>
      </form>
    </div>

    <!-- Success state -->
    <div id="success-view" class="flex-1 hidden flex-col items-center text-center px-8 justify-center">
      <div class="w-16 h-16 rounded-2xl bg-success-50 dark:bg-success-500/10 flex items-center justify-center text-success-600 dark:text-success-300 mb-6" id="check-icon"></div>
      <h1 class="text-xl font-extrabold tracking-tight mb-2">Check your messages</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-8">We sent reset instructions to <span id="sent-to" class="font-semibold text-slate-700 dark:text-slate-200"></span>. It may take a minute to arrive.</p>
      <a href="login.html" class="btn btn-primary btn-lg w-full">Back to login</a>
      <button id="resend-again" class="text-sm font-semibold text-primary-600 dark:text-primary-400 mt-4">Didn't get it? Resend</button>
    </div>
  </div>
</div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/customer-shell.js"></script>
<script>
  document.querySelector('a[href="login.html"]').innerHTML = Icons.html('arrow-left', { size: 18 });
  document.getElementById('lock-icon').innerHTML = Icons.html('lock-closed', { size: 28 });
  document.getElementById('check-icon').innerHTML = Icons.html('check-circle', { size: 28 });

  document.getElementById('reset-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const val = document.getElementById('identifier').value.trim();
    const errEl = document.querySelector('[data-error-for="identifier"]');
    if (!val) {
      errEl.textContent = 'Enter your phone or email.';
      errEl.classList.remove('hidden');
      document.getElementById('identifier').classList.add('input-error');
      return;
    }
    errEl.classList.add('hidden');
    document.getElementById('identifier').classList.remove('input-error');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    document.getElementById('submit-label').innerHTML = `<span class="inline-flex items-center gap-2"><svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>Sending…</span>`;

    setTimeout(() => {
      document.getElementById('sent-to').textContent = val;
      document.getElementById('request-view').classList.add('hidden');
      const success = document.getElementById('success-view');
      success.classList.remove('hidden');
      success.classList.add('flex');
    }, 1000);
  });

  document.getElementById('resend-again').addEventListener('click', () => {
    Eksabli.showToast({ type: 'success', title: 'Instructions resent', message: 'Check your messages again shortly.' });
  });
</script>
</body>
</html>
